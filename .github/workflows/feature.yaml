name: feature pipeline
on:
 push:
 workflow_dispatch: 
  # branches_ignore: #we ignore main branch by this ignore case
  #  - 'main'
jobs:
 feature-workflow:
    if: github.ref_name != 'main'
    uses: srikanth-8651/workflows/.github/workflows/nodejs-eks-feature.yaml@main
    with:
      project: 'roboshop'     
      component: 'catalogue'
    permissions:
     statuses: write
     contents: write
     pull-requests: write
    secrets: inherit
   #main flow starts here DEV environment
 dev-workflow:
    if: github.ref_name == 'main'
    uses: srikanth-8651/workflows/.github/workflows/nodejs-eks-main.yaml@main  #calls the reusable workflow.
    with: #passing inputs 
      project: 'roboshop' 
      component: 'catalogue'  
      environment: 'dev'
    secrets: inherit
    #Sit environment
 sit-workflow:
    if: github.ref_name == 'main'
    uses: srikanth-8651/workflows/.github/workflows/nodejs-eks-main.yaml@main
    with:
      project: 'roboshop'
      component: 'catalogue'
      environment: 'sit'
      commit_id: ${{ github.sha }}
    secrets: inherit
    secrets: inherit
 uat-workflow:
    if: github.ref_name == 'main'
    uses: srikanth-8651/workflows/.github/workflows/nodejs-eks-main.yaml@main
    with:
      project: 'roboshop'
      component: 'catalogue'
      environment: 'uat'
    secrets: inherit
 prod-workflow:
  if: github.ref_name == 'main'
  needs: uat-workflow
  uses: srikanth-8651/workflows/.github/workflows/nodejs-eks-main.yaml@main
  with:
    project: roboshop
    component: catalogue
    environment: prod
    commit_id: ${{ github.sha }}
    cr_number: ${{ inputs.cr_number }}
    version: ${{ inputs.version }}
  secrets: inherit
